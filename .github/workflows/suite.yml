name: suite

# The suite and the credential scan, rather than `felix gate`.
#
# Not a weaker choice, and worth saying why in the file rather than in a commit
# message nobody reads. `felix gate` additionally QUALIFIES each checker: it
# plants a mutation and demands the checker catch it. Two of those mutations
# plant one governed project's name into the engine's runtime and require the
# independence checker to find it — and this repository governs exactly one
# project, its own. There is no second name to leak, so those two controls
# cannot be satisfied here by any correct engine.
#
# A check that cannot pass is not verification, it is a permanent red light,
# and a permanent red light is how people learn to stop reading CI. What CAN be
# verified here is verified: the whole suite, and every tracked file scanned
# for credentials as though it had just been added.
#
# Adopt Felix for a second project and `felix gate` becomes the right command
# again. It is in the repository, unchanged.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The engine's own suite
        run: ./engine/harness/tests/run

      # `secret-scan --tree` is deliberately NOT run here. It treats every
      # line of every tracked file as newly added, which is right for the
      # question "is there a credential anywhere in this repository" and wrong
      # as a gate: this suite plants fake keys on purpose, and all seventeen of
      # them surface every time. It is an audit a person reads before
      # publishing — it was read before this snapshot was published, and every
      # hit was one of those fixtures — not a red light to get used to.
      #
      # The diff gate is the CI-shaped question, and `felix gate` runs it.
