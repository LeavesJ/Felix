<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FELIX // governance layer</title>
<style>
:root{
  --void:#03080d; --panel:rgba(6,20,28,.55); --panel-2:rgba(4,12,18,.35);
  --cy:#22d3ee; --cy-2:#0e7f92; --cy-ghost:rgba(34,211,238,.09);
  --amber:#f2b25c; --jade:#4ade80; --red:#ff5d6e;
  --bone:#d8f0f4; --ash:#6d8f97; --ash-2:#2f4a52;
  --rule:rgba(34,211,238,.20);
  --mono:"SF Mono",SFMono-Regular,Menlo,Monaco,"Courier New",monospace;
  --face:Futura,"Avenir Next Condensed","Avenir Next",Optima,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--mono);font-size:12px;
  line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
.atmo,.scan,.grain{position:fixed;inset:0;pointer-events:none;z-index:0}
.atmo{background:radial-gradient(70vw 70vw at 50% 46%, rgba(10,70,86,.20), transparent 66%)}
.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px);
  opacity:.45;mix-blend-mode:multiply}
.grain{opacity:.04;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.6'/></svg>")}

.shell{position:relative;z-index:2;height:100vh;display:grid;
  grid-template-columns:minmax(230px,270px) minmax(0,1fr) minmax(230px,270px);
  grid-template-rows:auto 1fr;gap:12px;padding:12px 14px 14px}
/* A grid or flex item defaults to min-width:auto, which is the width of its
   content — so one unbreakable string, say a file path in a quoted prompt,
   refuses to shrink and shoves everything after it off the screen. Every
   ellipsis in this file is inert without these. */
.shell > *{min-width:0}

/* ---------------- top bar ---------------- */
.top{grid-column:1/-1;display:flex;align-items:center;gap:20px;min-width:0;flex-wrap:wrap;
  border:1px solid var(--rule);background:var(--panel);padding:9px 16px;position:relative}
.brand{display:flex;align-items:baseline;gap:12px}
.brand .n{font-family:var(--face);font-size:17px;letter-spacing:.42em;color:var(--cy);
  text-transform:uppercase;text-shadow:0 0 16px rgba(34,211,238,.5)}
.brand .t{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--ash-2)}
.top .sp{flex:1}
.stat{display:flex;align-items:center;gap:8px}
.stat .k{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash-2)}
.stat .v{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.stat .v.warn{color:var(--amber)} .stat .v.bad{color:var(--red)}
.led{width:6px;height:6px;border-radius:50%;background:var(--jade);
  box-shadow:0 0 10px var(--jade);animation:beat 2.6s ease-in-out infinite}
.led.warn{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.led.bad{background:var(--red);box-shadow:0 0 10px var(--red)}
.led.off{background:var(--ash-2);box-shadow:none;animation:none}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
.btn{font-family:var(--face);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  padding:5px 12px;background:transparent;border:1px solid var(--rule);color:var(--ash);
  cursor:pointer;transition:.16s}
.btn:hover{color:var(--bone);border-color:var(--cy-2)}
.btn[aria-pressed="true"]{background:var(--cy-ghost);color:var(--cy);border-color:var(--cy-2)}
.btn.live[aria-pressed="true"]{color:var(--jade);border-color:rgba(74,222,128,.55);
  background:rgba(74,222,128,.09)}

/* ---------------- panels, with the corner ticks ---------------- */
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.col .panel{display:flex;flex-direction:column;min-height:0}
.col .panel.grow{flex:1 1 auto}
.col .panel.fixed{flex:0 0 auto}
.panel .body{min-height:0;min-width:0;overflow:auto;flex:1 1 auto}
.panel .body::-webkit-scrollbar{width:5px}
.panel .body::-webkit-scrollbar-thumb{background:var(--ash-2)}
.panel{position:relative;border:1px solid var(--rule);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));padding:12px 14px 14px}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;
  border-color:var(--cy);opacity:.85;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid}
.panel::after{bottom:-1px;right:-1px;border-bottom:1px solid;border-right:1px solid}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.ph .l{font-family:var(--face);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone)}
.ph .l i{color:var(--cy-2);font-style:normal}
.ph .r{margin-left:auto;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--ash-2)}
.redact{height:5px;background:repeating-linear-gradient(90deg,var(--cy-ghost) 0 14px,transparent 14px 19px);
  margin:-6px 0 10px;opacity:.7}

.meter{margin-bottom:10px}.meter:last-child{margin-bottom:0}
.meter .t{display:flex;align-items:baseline;font-size:10px}
.meter .t span:first-child{letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.meter .t span:last-child{margin-left:auto;color:var(--bone);font-size:12px}
.meter .b{height:3px;background:rgba(255,255,255,.05);margin-top:5px}
.meter .f{height:100%;background:var(--cy);box-shadow:0 0 9px rgba(34,211,238,.7)}
.meter.good .f{background:var(--jade);box-shadow:0 0 9px rgba(74,222,128,.6)}
.meter.warn .f{background:var(--amber);box-shadow:0 0 9px rgba(242,178,92,.6)}
.meter.bad  .f{background:var(--red);box-shadow:0 0 9px rgba(255,93,110,.6)}

.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:11px;align-content:start}
.kv .k{color:var(--ash);letter-spacing:.1em}
.kv .v{color:var(--bone);text-align:right}
.rt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:11px;align-content:start}
.rt .n{color:var(--cy);letter-spacing:.06em}
.rt .p{color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.logl{display:grid;grid-template-columns:auto 1fr;gap:4px 9px;font-size:10.5px;
  align-content:start}
.logl .t{color:var(--ash-2)}
.logl .m{color:var(--ash);letter-spacing:.04em;text-transform:uppercase;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0}
.logl .m.ok{color:var(--jade)} .logl .m.bad{color:var(--red)} .logl .m.warn{color:var(--amber)}
.logl .m.day{color:var(--cy-2);letter-spacing:.24em;margin-top:7px;border-top:1px solid var(--rule);padding-top:6px}

/* ---------------- centre: radar core + the chat ---------------- */
.mid{display:flex;flex-direction:column;min-height:0;min-width:0;gap:12px}
.radar{flex:0 0 clamp(190px,29vh,290px)}
.chat{flex:1 1 auto}
.cmd{flex:0 0 auto}
.radar{position:relative;display:grid;place-items:center;border:1px solid var(--rule);
  background:linear-gradient(180deg,var(--panel),var(--panel-2))}
.radar::before,.radar::after{content:"";position:absolute;width:12px;height:12px;
  border-color:var(--cy);opacity:.8}
.radar::before{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid}
.radar::after{bottom:-1px;right:-1px;border-bottom:1px solid;border-right:1px solid}
.radar canvas{position:absolute;inset:0;width:100%;height:100%}
.core{position:relative;text-align:center;pointer-events:none}
.core .n{font-family:var(--face);font-size:clamp(15px,2.1vh,21px);letter-spacing:.28em;
  text-transform:uppercase;color:var(--cy);text-shadow:0 0 20px rgba(34,211,238,.6);line-height:1.3}
.core .s{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--ash-2);margin-top:5px}

.chat{min-height:0;overflow:auto;padding-right:5px}
.chat::-webkit-scrollbar{width:5px}.chat::-webkit-scrollbar-thumb{background:var(--ash-2)}
.turn{margin-bottom:8px;min-width:0;animation:rise .4s cubic-bezier(.16,.84,.44,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.you{color:var(--ash-2);font-size:10px;font-style:italic;margin:0 0 3px 3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%}
.you b{font-weight:400;font-style:normal;letter-spacing:.2em;text-transform:uppercase;
  font-size:8px;opacity:.8}
.msg{border:1px solid var(--rule);border-left:2px solid var(--cy-2);background:var(--panel);
  min-width:0;overflow:hidden}
.msg.held,.msg.plugin-blocked{border-left-color:var(--red)}
.msg.skipped,.msg.unrecorded{border-left-color:var(--amber)}
.msg .hd{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;transition:.15s}
.msg .hd:hover{background:var(--cy-ghost)}
.msg .caret{color:var(--ash-2);font-size:9px;transition:transform .2s}
.msg[data-open="1"] .caret{transform:rotate(90deg)}
.msg[data-open="1"] .hd{border-bottom:1px solid var(--rule)}
.bdg{font-family:var(--face);font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cy);border:1px solid var(--cy-2);padding:2px 7px;white-space:nowrap}
.bdg.held,.bdg.plugin-blocked{color:var(--red);border-color:rgba(255,93,110,.5)}
.bdg.skipped,.bdg.unrecorded{color:var(--amber);border-color:rgba(242,178,92,.5)}
.gist{flex:1 1 0;min-width:0;color:var(--bone);font-size:12px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tm{color:var(--ash-2);font-size:9.5px}
.msg pre{margin:0;padding:11px 14px;white-space:pre-wrap;word-break:break-word;
  font-size:11.5px;line-height:1.65;color:var(--ash);border-top:1px solid rgba(34,211,238,.07)}

.cmd{border:1px solid var(--rule);background:var(--panel);padding:9px 14px;
  display:flex;align-items:center;gap:12px;position:relative}
.cmd::before{content:"";position:absolute;top:-1px;left:-1px;width:10px;height:10px;
  border-top:1px solid var(--cy);border-left:1px solid var(--cy);opacity:.8}
.wave{display:flex;align-items:flex-end;gap:2px;height:14px}
.wave i{width:2px;background:var(--cy);opacity:.85;animation:w 1.1s ease-in-out infinite}
@keyframes w{0%,100%{height:3px}50%{height:14px}}
.cmd .txt{flex:1 1 0;min-width:0;color:var(--ash);font-size:11px;letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd .txt b{color:var(--cy);font-weight:400}
.empty{color:var(--ash-2);font-size:11px;padding:26px 4px}
.empty code{color:var(--cy)}

@media(max-width:1050px){
  body{overflow:auto}
  .shell{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
  .col .panel.grow,.col .panel.fixed{flex:0 0 auto}
  .panel .body{overflow:visible}.chat{overflow:visible}
  .radar{flex:0 0 auto;min-height:44vw}
  .radar{min-height:44vw}
}
@media(prefers-reduced-motion:reduce){.turn,.wave i,.led{animation:none}}
</style>
</head>
<body>
<div class="atmo"></div><div class="scan"></div><div class="grain"></div>

<div class="shell">
  <div class="top">
    <div class="brand"><span class="n">Felix</span><span class="t">governance layer</span></div>
    <div class="sp"></div>
    <div class="stat"><span class="k">state</span><span class="led" id="led"></span><span class="v" id="state">nominal</span></div>
    <div class="stat"><span class="k">time</span><span class="v" id="clock">--:--:--</span></div>
    <div class="stat"><span class="k">project</span><span class="v" id="projName">—</span></div>
    <div class="sp"></div>
    <div id="projs" style="display:flex;gap:6px"></div>
    <button class="btn live" id="liveBtn" aria-pressed="false">live</button>
  </div>

  <!-- left -->
  <div class="col">
    <section class="panel grow">
      <div class="ph"><span class="l">Felix <i>//</i> routes</span><span class="r" id="routeCount">—</span></div>
      <div class="redact"></div>
      <div class="body"><div class="rt" id="routes"></div></div>
    </section>
    <section class="panel fixed">
      <div class="ph"><span class="l">Felix <i>//</i> memory</span><span class="r">recall</span></div>
      <div class="redact"></div>
      <div class="body"><div class="kv" id="mem"></div></div>
    </section>
  </div>

  <!-- centre -->
  <div class="mid">
    <div class="radar">
      <canvas id="orb"></canvas>
      <div class="core">
        <div class="n" id="coreN">standby</div>
        <div class="s" id="coreS">nothing said yet</div>
      </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="cmd">
      <span class="wave" id="wave"></span>
      <span class="txt" id="cmd"><b>awaiting input</b></span>
      <span class="tm" id="stamp"></span>
    </div>
  </div>

  <!-- right -->
  <div class="col">
    <section class="panel fixed">
      <div class="ph"><span class="l">Felix <i>//</i> compliance</span><span class="r" id="cmpTag">—</span></div>
      <div class="redact"></div>
      <div class="body"><div id="cmp"></div></div>
    </section>
    <section class="panel fixed">
      <div class="ph"><span class="l">Felix <i>//</i> verification</span><span class="r" id="verTag">—</span></div>
      <div class="redact"></div>
      <div class="body"><div id="ver"></div></div>
    </section>
    <section class="panel grow">
      <div class="ph"><span class="l">Felix <i>//</i> archive</span><span class="r" id="logTag">—</span></div>
      <div class="redact"></div>
      <div class="body"><div class="logl" id="log"></div></div>
    </section>
  </div>
</div>

<script>
/* The marker is the whole value. An earlier version left a literal after it, so
   substitution produced `const DATA = {...} null;` — a syntax error on line one
   that killed the script while the frame still drew. */
const DATA =
/*{{FELIX_DATA}}*/
;

/* Everything reaches the DOM through textContent. Felix quotes back whatever
   was typed into a session, so treating any of it as markup would turn a prompt
   into script on a page about governance. Nothing here uses innerHTML. */
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;
  if(x!==undefined&&x!==null)n.textContent=String(x);return n;};
const clear=n=>{while(n.firstChild)n.removeChild(n.firstChild);return n;};
const at=id=>document.getElementById(id);

const D=(DATA&&DATA.projects)?DATA:{generated:'',projects:[]};
const S={proj:0};
const cur=()=>D.projects[S.proj]||{name:'—',says:[],routes:[],routeLog:[],verifyLog:[],mistakes:[],stack:[],lessons:0};
/* The logs are written in UTC, deliberately, so records from different machines
   sort. The page previously sliced the string straight out of the timestamp,
   which showed UTC wearing a local clock's label: a 12:56 session read 19:56.
   Parsed and reformatted, so what you see is the time you were sitting there. */
const _d=t=>{const d=new Date(String(t||''));return isNaN(d.getTime())?null:d;};
const hhmm=t=>{const d=_d(t);return d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}):'';};
const hms =t=>{const d=_d(t);return d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'';};
const dayof=t=>{const d=_d(t);return d?d.toLocaleDateString([],{month:'short',day:'numeric'}):'';};
const isToday=t=>{const d=_d(t);if(!d)return false;const n=new Date();
  return d.toDateString()===n.toDateString();};
const unesc=s=>String(s||'').replace(/\\n/g,'\n').replace(/\\\\/g,'\\');

const LABEL={brief:'routed',held:'held',skipped:'flagged','plugin-blocked':'alarm',unrecorded:'note'};

/* A prompt can arrive carrying an attached file path and escaped quotes. Shown
   raw it is unreadable and, before the min-width fixes above, it also pushed a
   whole column off the screen. */
function tidy(s){
  let t=String(s||'').replace(/\\"/g,'"').replace(/\\n/g,' ').replace(/\s+/g,' ').trim();
  /* Belt and braces for anything already recorded with the payload glued on. */
  t=t.replace(/","[a-z_]+"\s*:.*$/i,'');
  t=t.replace(/@?"?(\/[^\s"]*\/)([^\/\s"]+)"?/g,'$2');
  return t.length>150?t.slice(0,150)+'…':t;
}

/* One line saying what it did. Somebody using an agent to write code does not
   want a transcript of everything their governance layer whispered; the words
   are kept in full and open on a click. */
function gist(s){
  const t=unesc(s.text);
  if(s.kind==='brief'){
    const to=(t.match(/routed this to:\s*(\S+)/)||[])[1];
    const use=(t.match(/Use this now:\s*([^\n(]+)/)||[])[1];
    const les=/Lessons this project/.test(t)?' + lessons':'';
    if(to&&use)return to+' · use '+use.trim()+les;
    if(to)return to+les;
    return 'mounted lessons';
  }
  if(s.kind==='held'){
    if(/never run/.test(t))return'held it back — the tests have never run here';
    if(/failed on this exact/.test(t))return'held it back — the tests failed on this version';
    return'held it back — the code changed since the tests ran';
  }
  if(s.kind==='skipped'){
    const w=(t.match(/asks for\n?([^,\n]+)/)||[])[1];
    return'flagged a step never taken'+(w?' — '+w.trim():'');
  }
  if(s.kind==='plugin-blocked'){
    const n=(t.match(/blocked (\d+) tool/)||[])[1];
    const who=(t.match(/from\s+the\s+(\S+)\s+plugin/)||[])[1];
    return (who||'a plugin')+' blocked '+(n||'some')+' of your tool calls';
  }
  if(s.kind==='unrecorded')return'asked for a note on what the gate caught';
  return (t.split('\n')[0]||'').trim();
}

/* ------------------------------------------------------------- the core -- */
const cv=at('orb'),cx=cv.getContext('2d');
const HUE={calm:[34,211,238],warn:[242,178,92],bad:[255,93,110]};
let P=[],W=0,H=0,spin=0,mood='calm',agit=0,pulse=0;
function seed(n){P=[];for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,r=Math.sqrt(Math.max(0,1-y*y));
  const th=Math.PI*(3-Math.sqrt(5))*i;P.push({x:Math.cos(th)*r,y:y,z:Math.sin(th)*r,j:Math.random()*6.28});}}
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=Math.max(1,W*d);cv.height=Math.max(1,H*d);cx.setTransform(d,0,0,d,0,0);}
function draw(t){
  cx.clearRect(0,0,W,H);
  const px=W/2,py=H/2,R=Math.min(W,H)*0.34;
  const c=HUE[mood],rgb=a=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
  spin+=0.0013+agit*0.004;

  /* concentric rings, dashed and gapped, plus the crosshair — a reticle rather
     than a clock face */
  const rings=[[1.00,.10,[]],[1.32,.16,[3,7]],[1.66,.12,[22,12]],[1.98,.07,[1,20]]];
  rings.forEach((g,i)=>{cx.save();cx.translate(px,py);cx.rotate(t*0.00007*(i%2?-1:1));
    cx.strokeStyle=rgb(g[1]);cx.lineWidth=1;cx.setLineDash(g[2]);
    cx.beginPath();cx.arc(0,0,R*g[0],0,6.2832);cx.stroke();cx.restore();});
  cx.save();cx.translate(px,py);cx.strokeStyle=rgb(.10);cx.setLineDash([2,6]);cx.lineWidth=1;
  for(let i=0;i<4;i++){cx.rotate(Math.PI/2);cx.beginPath();cx.moveTo(R*0.34,0);cx.lineTo(R*1.98,0);cx.stroke();}
  cx.restore();
  /* sweep */
  const sa=t*0.0004;
  const g2=cx.createLinearGradient(px,py,px+Math.cos(sa)*R*1.98,py+Math.sin(sa)*R*1.98);
  g2.addColorStop(0,rgb(.22));g2.addColorStop(1,'rgba(0,0,0,0)');
  cx.strokeStyle=g2;cx.lineWidth=2;cx.setLineDash([]);
  cx.beginPath();cx.moveTo(px,py);cx.lineTo(px+Math.cos(sa)*R*1.98,py+Math.sin(sa)*R*1.98);cx.stroke();

  /* the core itself */
  const sn=Math.sin(spin),cs=Math.cos(spin),tilt=.42;
  for(const p of P){
    const x1=p.x*cs+p.z*sn,z1=-p.x*sn+p.z*cs;
    const y1=p.y*Math.cos(tilt)-z1*Math.sin(tilt), z2=p.y*Math.sin(tilt)+z1*Math.cos(tilt);
    const br=1+Math.sin(t*0.001+p.j)*(0.02+agit*0.05+pulse*0.05);
    const dp=(z2+1)/2;
    cx.fillStyle=rgb(0.05+dp*(0.32+pulse*0.3));
    cx.beginPath();cx.arc(px+x1*R*0.72*br,py+y1*R*0.72*br,0.45+dp*1.25,0,6.2832);cx.fill();
  }
  if(pulse>0)pulse=Math.max(0,pulse-0.011);
  requestAnimationFrame(draw);
}

/* --------------------------------------------------------------- render -- */
/* The session Felix is in right now, which is whichever one spoke most
   recently. Anything from an earlier session is history and belongs in the log,
   not in front of you: the centre stays the size of what is happening. */
/* A record with no session was written before Felix tracked them. It is
   history by definition, so it files itself rather than joining whatever
   session happens to be newest. */
function liveSession(){const s=(cur().says||[]).find(x=>x.session);return s?s.session:null;}
function liveSays(){const id=liveSession();
  return id?(cur().says||[]).filter(s=>s.session===id):[];}
function pastSays(){const id=liveSession();
  return (cur().says||[]).filter(s=>!s.session||s.session!==id);}

function renderChat(){
  const p=cur(),box=clear(at('chat')),says=liveSays();
  if(!says.length){
    const e=el('div','empty');
    e.appendChild(el('div',null,'Nothing said in this session yet.'));
    const c=el('div');c.appendChild(el('span',null,'Work in it and every word it sends to Claude lands here. Turn on '));
    c.appendChild(el('code',null,'live'));c.appendChild(el('span',null,' with felix monitor --watch running.'));
    e.appendChild(c);box.appendChild(e);return;
  }
  says.forEach((s,i)=>{
    const turn=el('div','turn');turn.style.animationDelay=Math.min(i,10)*0.025+'s';
    if(s.cause){const y=el('div','you');y.appendChild(el('b',null,'you said '));
      y.appendChild(el('span',null,s.cause));turn.appendChild(y);}
    const kind=s.kind||'brief',msg=el('div','msg '+kind);msg.dataset.open='0';
    const hd=el('div','hd');
    hd.appendChild(el('span','caret','▸'));
    hd.appendChild(el('span','bdg '+kind,LABEL[kind]||kind));
    hd.appendChild(el('span','gist',gist(s)));
    hd.appendChild(el('span','tm',hhmm(s.t)));
    msg.appendChild(hd);
    const pre=el('pre',null,unesc(s.text));pre.style.display='none';
    msg.appendChild(pre);
    hd.addEventListener('click',()=>{const o=msg.dataset.open==='1';
      msg.dataset.open=o?'0':'1';pre.style.display=o?'none':'block';});
    turn.appendChild(msg);box.appendChild(turn);
  });
}
function renderRoutes(){
  const p=cur(),box=clear(at('routes')),rs=p.routes||[];
  at('routeCount').textContent=rs.length+' defined';
  if(!rs.length){box.appendChild(el('div','k','none'));return;}
  rs.forEach(r=>{box.appendChild(el('span','n',r.name));
    box.appendChild(el('span','p',(r.play&&r.play!=='-')?r.play:'—'));});
}
function renderMem(){
  const p=cur(),box=clear(at('mem'));
  /* Totals come from the payload, never from the arrays: those are `tail -n`
     windows, and rendering a window's length as a total read "things said 60"
     over a log holding 755. `stack` is the whole manifest, so its length is
     the count. */
  const rows=[['lessons on file',p.lessons||0],
              ['gate failures',p.mistakesTotal??(p.mistakes||[]).length],
              ['tools declared',(p.stack||[]).length],
              ['things said',p.saysTotal??(p.says||[]).length]];
  rows.forEach(([k,v])=>{box.appendChild(el('span','k',k));box.appendChild(el('span','v',v));});
}
function meter(label,val,pct,cls){
  const m=el('div','meter'+(cls?' '+cls:''));const t=el('div','t');
  t.appendChild(el('span',null,label));t.appendChild(el('span',null,val));m.appendChild(t);
  const b=el('div','b'),f=el('div','f');f.style.width=Math.max(0,Math.min(100,pct))+'%';
  b.appendChild(f);m.appendChild(b);return m;
}
/* The only panel that speaks to whether any of this works.
   Everything else here is a record of what Felix SAID. This is what the session
   then DID: `named` is what a route pointed at, `followed` is what got reached
   for. A route table nobody follows is an expensive way of talking to yourself,
   and until this panel existed nothing could tell the difference. */
function renderCompliance(){
  const p=cur(),cl=p.compliance||[],box=clear(at('cmp'));
  if(!cl.length){
    at('cmpTag').textContent='no data';
    box.appendChild(el('div','muted','Nothing recorded yet. A session has to route and then run before this can say anything, and a ledger written before Felix recorded what it named cannot answer it at all.'));
    return;
  }
  const named=cl.reduce((n,c)=>n+c.named,0);
  const followed=cl.reduce((n,c)=>n+c.followed,0);
  const rate=named?Math.round(followed/named*100):0;
  at('cmpTag').textContent=cl.length+(cl.length===1?' session':' sessions');
  box.appendChild(meter('named and then used',named?rate+'%':'—',rate,
                        rate>=70?'good':rate>=35?'warn':'bad'));
  box.appendChild(meter('named, never reached for',String(named-followed),
                        Math.min(100,(named-followed)*15),(named-followed)?'warn':'good'));
  cl.slice(-6).reverse().forEach(c=>{
    const r=el('div','kv');
    r.appendChild(el('span',null,c.date));
    r.appendChild(el('span',null,c.followed+'/'+c.named));
    box.appendChild(r);
  });
}
function renderVer(){
  const p=cur(),vl=p.verifyLog||[],rl=p.routeLog||[],box=clear(at('ver'));
  const passed=vl.filter(v=>v.verdict==='allowed').length;
  const rate=vl.length?Math.round(passed/vl.length*100):0;
  const miss=rl.filter(r=>!r.route||r.route==='-').length;
  const rec=rl.length?Math.round((1-miss/rl.length)*100):0;
  /* The rates below are honest about being recent — they are computed over the
     window the payload carries — so the tag says which. */
  const vTot=p.verifyLogTotal??vl.length;
  at('verTag').textContent=vl.length?(vTot>vl.length?('last '+vl.length+' of '+vTot+' verdicts'):(vTot+' verdicts')):'none yet';
  box.appendChild(meter('checks passed',vl.length?rate+'%':'—',rate,rate>=80?'good':rate>=40?'warn':'bad'));
  box.appendChild(meter('asks recognised',rl.length?rec+'%':'—',rec,rec>=80?'good':rec>=50?'warn':'bad'));
  const held=p.heldTotal??(p.says||[]).filter(s=>s.kind==='held'||s.kind==='plugin-blocked').length;
  box.appendChild(meter('times held',String(held),Math.min(100,held*20),held?'bad':'good'));
}
/* Sessions that have ended. The live one is in the middle of the screen; this
   is where it goes once it is over, so the centre never accumulates. */
function renderLog(){
  const p=cur(),box=clear(at('log')),ev=[];
  pastSays().forEach(s=>ev.push({t:s.t,m:(LABEL[s.kind]||s.kind)+' · '+gist(s),
    c:(s.kind==='held'||s.kind==='plugin-blocked')?'bad':(s.kind==='skipped'||s.kind==='unrecorded')?'warn':''}));
  (p.verifyLog||[]).forEach(v=>ev.push({t:v.t,m:'gate '+v.verdict+' · '+v.reason,
    c:v.verdict==='blocked'?'bad':v.verdict==='override'?'warn':'ok'}));
  ev.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  const n=new Set(pastSays().map(s=>s.session||'unknown')).size;
  at('logTag').textContent=n?n+' past session'+(n===1?'':'s'):'archive';
  if(!ev.length){box.appendChild(el('span','t',''));box.appendChild(el('span','m','nothing archived yet'));return;}
  let lastDay='';
  ev.slice(0,60).forEach(e=>{
    const d=dayof(e.t);
    if(d!==lastDay&&!isToday(e.t)){lastDay=d;
      box.appendChild(el('span','t',''));box.appendChild(el('span','m day',d));}
    box.appendChild(el('span','t','['+hms(e.t)+']'));
    box.appendChild(el('span','m '+e.c,e.m));});
}
function renderTop(){
  const p=cur(),says=p.says||[],last=says[0];
  at('projName').textContent=p.name;
  mood=!last?'calm':(last.kind==='held'||last.kind==='plugin-blocked')?'bad'
      :(last.kind==='skipped'||last.kind==='unrecorded')?'warn':'calm';
  agit=mood==='bad'?1:mood==='warn'?.4:0;
  at('led').className='led'+(mood==='bad'?' bad':mood==='warn'?' warn':says.length?'':' off');
  at('state').className='v'+(mood==='bad'?' bad':mood==='warn'?' warn':'');
  at('state').textContent=!last?'standby':mood==='bad'?'holding':mood==='warn'?'flagged':'nominal';
  at('coreN').textContent=last?(LABEL[last.kind]||last.kind):'standby';
  at('coreN').style.color=mood==='bad'?'var(--red)':mood==='warn'?'var(--amber)':'var(--cy)';
  at('coreS').textContent=last?hms(last.t):'nothing said yet';
  const cmd=clear(at('cmd'));
  if(last&&last.cause){cmd.appendChild(el('b',null,'last input · '));cmd.appendChild(el('span',null,tidy(last.cause)));}
  else cmd.appendChild(el('b',null,'awaiting input'));
}
function renderProjects(){
  const box=clear(at('projs'));
  D.projects.forEach((p,i)=>{const b=el('button','btn',p.name);
    b.setAttribute('aria-pressed',String(i===S.proj));b.dataset.p=String(i);box.appendChild(b);});
}
function paint(){renderProjects();renderTop();renderRoutes();renderMem();renderCompliance();renderVer();renderLog();renderChat();pulse=1;}
document.addEventListener('click',e=>{const p=e.target.closest('.btn[data-p]');
  if(p){S.proj=Number(p.dataset.p);paint();}});

/* wave bars */
(function(){const w=at('wave');for(let i=0;i<9;i++){const b=el('i');
  b.style.animationDelay=(i*0.09)+'s';b.style.height=(3+((i*37)%12))+'px';w.appendChild(b);}})();

/* ------------------------------------------------------------------ live -- */
const REFRESH_MS=4000,KEY='felix.monitor.view';
function saveView(){try{sessionStorage.setItem(KEY,JSON.stringify({proj:S.proj,
  y:at('chat')?at('chat').scrollTop:0}));}catch(e){}}
function restoreView(){let v=null;try{v=JSON.parse(sessionStorage.getItem(KEY)||'null');}catch(e){}
  if(!v)return;if(typeof v.proj==='number'&&D.projects[v.proj])S.proj=v.proj;
  requestAnimationFrame(()=>{if(at('chat'))at('chat').scrollTop=v.y||0;});}
let live=false,timer=null;
function setLive(on){live=!!on;try{localStorage.setItem('felix.monitor.live',live?'1':'0');}catch(e){}
  at('liveBtn').setAttribute('aria-pressed',String(live));
  if(timer){clearTimeout(timer);timer=null;}
  if(live)timer=setTimeout(()=>{saveView();location.reload();},REFRESH_MS);}
at('liveBtn').addEventListener('click',()=>setLive(!live));
window.addEventListener('beforeunload',saveView);

/* Ticks every second regardless of activity. A live panel whose only moving
   part is the data looks frozen on a quiet afternoon, and the question it has
   to answer at a glance is "is this thing still running". */
function tick(){
  const now=new Date();
  at('clock').textContent=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const g=_d(D.generated);
  if(g){const secs=Math.max(0,Math.round((now-g)/1000));
    at('stamp').textContent='snapshot '+hms(D.generated)+' · '+
      (secs<60?secs+'s ago':Math.round(secs/60)+'m ago');}
  else at('stamp').textContent='snapshot —';
}
tick(); setInterval(tick,1000);
restoreView();seed(260);fit();paint();requestAnimationFrame(draw);
window.addEventListener('resize',fit);
try{setLive(localStorage.getItem('felix.monitor.live')==='1');}catch(e){setLive(false);}
</script>
